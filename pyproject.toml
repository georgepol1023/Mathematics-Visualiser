[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mathviz"
dynamic = ["version"]
description = "A free desktop app for plotting, animating and exploring functions and calculus"
readme = "README.md"
license = "MIT"
authors = [{ name = "George Politis" }]
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.20",
    "sympy>=1.9",
    "scipy>=1.7",
    "pillow>=8.0",
]
keywords = ["mathematics", "calculus", "plotting", "visualisation", "education", "matplotlib", "sympy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Environment :: X11 Applications :: Tk",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/georgepol1023/Mathematics-Visualiser"
Changelog = "https://github.com/georgepol1023/Mathematics-Visualiser/blob/main/CHANGELOG.md"

[project.gui-scripts]
mathviz = "mathviz.app:main"

[tool.setuptools]
packages = ["mathviz"]

[tool.setuptools.dynamic]
version = { attr = "mathviz.__version__" }
