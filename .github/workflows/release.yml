# Builds the Windows app and attaches it to a GitHub release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python build_exe.py
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/MathematicsVisualiser.exe -Algorithm SHA256).Hash.ToLower()
          "$h  MathematicsVisualiser.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MathematicsVisualiser.exe
            dist/SHA256SUMS.txt
          body_path: .github/release-notes.md
      - name: Keep the build (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: MathematicsVisualiser-windows
          path: dist/
